# 法人ホームページの写真を取得して一時ブランチに保存（求人用写真の候補・手動実行のみ。サイトには自動で載りません）
name: ホームページ写真の取得
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 写真を取得するページのURL（スペース区切り）
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-images.js out ${{ github.event.inputs.urls }}
      - name: 確認しやすい大きさに縮小
        run: |
          command -v mogrify > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null)
          cd out && for f in *.jpg *.jpeg *.png *.webp; do [ -f "$f" ] && mogrify -auto-orient -resize '2000x2000>' -quality 88 "$f"; done; du -sh .
      - name: 一時ブランチ（tmp-homepage-images）に保存（確認後に削除）
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan tmp-homepage-images
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          git add out && git commit -qm "ホームページ写真の候補（確認用・一時保存）"
          git push -f origin tmp-homepage-images
